<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CrewDeck — mission control for AI agents</title>
    <meta name="description" content="Run a company of AI agents: org chart, task board with locks and dependencies, budgets with hard stops, approvals, routines and a full audit trail. Zero dependencies." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='44' rx='10' fill='%236d5efc'/%3E%3Ccircle cx='24' cy='30' r='5' fill='white'/%3E%3Ccircle cx='40' cy='30' r='5' fill='white'/%3E%3Crect x='22' y='41' width='20' height='4' rx='2' fill='white'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand"><span class="logo">◧</span> CrewDeck <span class="company" id="companyName">…</span></div>
      <div class="stats" id="stats"></div>
      <div class="actions">
        <span class="mode" id="mode"></span>
        <button class="btn primary" data-open="task">＋ Task</button>
        <button class="btn" data-open="agent">Hire agent</button>
        <button class="btn" data-open="goal">Goal</button>
        <button class="btn" data-open="routine">Routine</button>
        <button class="btn ghost" id="menuBtn" aria-label="More">⋯</button>
        <div class="menu" id="menu" hidden>
          <button data-act="company">Company settings</button>
          <button data-act="export">Export JSON</button>
          <button data-act="import">Import JSON</button>
          <button data-act="demo">Load demo company</button>
        </div>
      </div>
    </header>
    <nav class="tabs" id="tabs">
      <button data-tab="board" class="on">Board</button>
      <button data-tab="org">Org &amp; budgets</button>
      <button data-tab="goals">Goals</button>
      <button data-tab="routines">Routines</button>
      <button data-tab="costs">Costs</button>
      <button data-tab="activity">Activity</button>
    </nav>
    <main id="view"></main>
    <aside class="drawer" id="drawer" hidden></aside>
    <dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
    <input type="file" id="importFile" accept="application/json" hidden />
    <div class="toasts" id="toasts"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
